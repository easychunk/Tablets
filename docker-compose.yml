version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: tablets-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tablets
      MYSQL_USER: tablets
      MYSQL_PASSWORD: tablets
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build:
      context: ./backend
    container_name: tablets-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tablets
      DB_USER: tablets
      DB_PASSWORD: tablets
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      JWT_SECRET: xP13294yqDfd0u5RZpeGlBV78nsrWhg6bAIOwmjQMkoHtKXvFCaiUNLcTYESzJ
      JWT_EXP_MINUTES: 480
      TIMEZONE: Europe/Vienna
      GRACE_MINUTES: 5
      MEDIA_DIR: /app/media
      MEDIA_URL_PREFIX: /media
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - ./media:/app/media
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: tablets-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  db_data:
