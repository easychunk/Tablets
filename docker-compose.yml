version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: tablets-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tablets
      MYSQL_USER: tablets
      MYSQL_PASSWORD: tablets
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build:
      context: ./backend
    container_name: tablets-backend
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
